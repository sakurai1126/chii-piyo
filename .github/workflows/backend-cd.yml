name: Backend CD

on:
  # mainブランチのpushまたはマージされたときに実行
  push:
    branches:
      - main
    # 変更対象ファイル
    paths:
      - "backend/**"
      - "compose.prod.yml"
      - ".github/workflows/backend-cd.yml"

# GHCRへの書き込み権限を付与
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Dockerイメージのビルド & GHCR push
    # 実行環境のOS
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCR へのログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockerイメージのビルド & push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chii-piyo-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Lightsail へのデプロイ
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Lightsail サーバーへ SSH 接続してデプロイ
        uses: appleboy/ssh-action@v1.0.3
        # SSH接続に必要な情報をGitHub Secretsから取得
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

          script: |
            # エラーが起きたら即座に処理を中断
            set -e

            # デプロイ先のディレクトリに移動
            cd /opt/chii-piyo

            # GHCRから最新イメージを取得
            docker compose -f compose.prod.yml pull backend

            # バックエンドコンテナを再起動
            docker compose -f compose.prod.yml up -d backend

            # 未使用の古いDockerイメージを削除してディスクを掃除
            docker image prune -f
