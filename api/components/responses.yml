# エラー系レスポンスの定義
# 400
BadRequest:
  description: 不正なリクエスト。
  content:
    application/json;charset=UTF-8:
      schema:
        $ref: "./schemas/common.yml#/ErrorResponseDto"
# 401
Unauthorized:
  description: 認証エラー。
  content:
    application/json;charset=UTF-8:
      schema:
        $ref: "./schemas/common.yml#/ErrorResponseDto"
# 403
Forbidden:
  description: アクセス権限エラー。
  content:
    application/json;charset=UTF-8:
      schema:
        $ref: "./schemas/common.yml#/ErrorResponseDto"
# 404
NotFound:
  description: 指定されたリソースが見つからない。
  content:
    application/json;charset=UTF-8:
      schema:
        $ref: "./schemas/common.yml#/ErrorResponseDto"
# 500
InternalServerError:
  description: サーバー内部でエラー発生。
  content:
    application/json;charset=UTF-8:
      schema:
        $ref: "./schemas/common.yml#/ErrorResponseDto"
# その他のエラー
DefaultErrors:
  description: 予期しないエラーが発生。
  content:
    application/json;charset=UTF-8:
      schema:
        $ref: "./schemas/common.yml#/ErrorResponseDto"
