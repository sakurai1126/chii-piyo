# 身長・体重記録
GrowthRecordResponseDto:
  type: object
  description: 身長・体重記録情報
  required:
    - id
    - measurementDate
    - note
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int64
      description: 記録ID
      example: 1
    measurementDate:
      type: string
      format: date
      description: 測定日
      example: "2026-01-01"
    height:
      type: ["number", "null"]
      format: double
      description: 身長（cm）
      example: 75.5
    weight:
      type: ["number", "null"]
      format: double
      description: 体重（kg）
      example: 9.50
    note:
      type: "string"
      description: メモ
    createdAt:
      type: string
      format: date-time
      description: 作成日時
      example: "2026-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 更新日時
      example: "2026-01-01T00:00:00Z"

GrowthRecordRequestDto:
  type: object
  description: 身長・体重記録作成・更新リクエスト
  required:
    - measurementDate
    - note
  properties:
    measurementDate:
      type: string
      format: date
      description: 測定日
      example: "2026-01-01"
    height:
      type: ["number", "null"]
      format: double
      description: 身長（cm）
      example: 75.5
    weight:
      type: ["number", "null"]
      format: double
      description: 体重（kg）
      example: 9.50
    note:
      type: string
      description: メモ
