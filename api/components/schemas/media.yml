# 写真・動画
MediaResponseDto:
  type: object
  description: メディア情報
  required:
    - id
    - uploadedBy
    - mediaType
    - originalFilename
    - contentType
    - fileSize
    - width
    - height
    - s3Key
    - thumbnailS3Key
    - takenAt
    - albumId
    - sharingGroupId
    - uploadStatus
    - tags
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int64
      description: メディアID
      example: 1
    uploadedBy:
      type: integer
      format: int64
      description: アップロードしたユーザーID
      example: 1
    mediaType:
      type: string
      description: メディア種別
      enum:
        - PHOTO
        - VIDEO
      example: "PHOTO"
    originalFilename:
      type: string
      description: ファイル名
      example: "IMG_20260101.jpg"
    contentType:
      type: string
      description: MIMEタイプ
      example: "image/jpeg"
    fileSize:
      type: integer
      format: int64
      description: ファイルサイズ（バイト）
      example: 2048000
    width:
      type: ["integer", "null"]
      description: 幅（ピクセル）
      example: 1920
    height:
      type: ["integer", "null"]
      description: 高さ（ピクセル）
      example: 1080
    s3Key:
      type: string
      description: S3オブジェクトキー
      example: "media/2026/01/01/abc123.jpg"
    thumbnailS3Key:
      type: ["string", "null"]
      description: サムネイルのS3キー
      example: "thumbnails/2026/01/01/abc123.jpg"
    takenAt:
      type: ["string", "null"]
      format: date
      description: 撮影日
      example: "2026-01-01"
    albumId:
      type: ["integer", "null"]
      format: int64
      description: 所属アルバムID
      example: 1
    sharingGroupId:
      type: integer
      format: int64
      description: 共有範囲グループID
      example: 1
    uploadStatus:
      type: string
      description: アップロード状況
      enum:
        - PROCESSING
        - COMPLETED
        - FAILED
      example: "COMPLETED"
    tags:
      type: array
      description: 付与されているタグ一覧
      items:
        $ref: "./tags.yml#/TagResponseDto"
    isFavorite:
      type: boolean
      description: お気に入り済みフラグ
      example: false
    createdAt:
      type: string
      format: date-time
      description: 作成日時
      example: "2026-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 更新日時
      example: "2026-01-01T00:00:00Z"

MediaListResponseDto:
  type: object
  description: メディア一覧レスポンス
  required:
    - items
    - totalCount
    - hasNext
  properties:
    items:
      type: array
      items:
        $ref: "#/MediaResponseDto"
    totalCount:
      type: integer
      format: int64
      description: 総件数
      example: 150
    hasNext:
      type: boolean
      description: 次のページが存在するかどうか
      example: true

MediaUploadRequestDto:
  type: object
  description: メディアアップロードリクエスト
  required:
    - mediaType
    - originalFilename
    - contentType
    - fileSize
    - sharingGroupId
  properties:
    mediaType:
      type: string
      description: メディア種別
      enum:
        - PHOTO
        - VIDEO
      example: "PHOTO"
    originalFilename:
      type: string
      description: ファイル名
      maxLength: 255
      example: "IMG_20260101.jpg"
    contentType:
      type: string
      description: MIMEタイプ
      maxLength: 100
      example: "image/jpeg"
    fileSize:
      type: integer
      format: int64
      description: ファイルサイズ（バイト）
      example: 2048000
    width:
      type: ["integer", "null"]
      description: 幅（ピクセル）
    height:
      type: ["integer", "null"]
      description: 高さ（ピクセル）
    takenAt:
      type: ["string", "null"]
      format: date
      description: 撮影日
      example: "2026-01-01"
    albumId:
      type: ["integer", "null"]
      format: int64
      description: 所属アルバムID
    sharingGroupId:
      type: integer
      format: int64
      description: 共有範囲グループID
      example: 1

MediaUploadResponseDto:
  type: object
  description: メディアアップロードレスポンス
  required:
    - mediaId
    - presignedUrl
  properties:
    mediaId:
      type: integer
      format: int64
      description: 作成されたメディアID
      example: 1
    presignedUrl:
      type: string
      description: S3アップロード用の署名付きURL
      example: "https://s3.amazonaws.com/bucket/..."

MediaUpdateRequestDto:
  type: object
  description: メディア更新リクエスト
  properties:
    albumId:
      type: ["integer", "null"]
      format: int64
      description: 所属アルバムID
    sharingGroupId:
      type: integer
      format: int64
      description: 共有範囲グループID

MediaIdsRequestDto:
  type: object
  description: はじめて/ことば記録に紐づけるためのメディアID指定リクエスト
  required:
    - mediaIds
  properties:
    mediaIds:
      type: array
      description: メディアIDの配列
      items:
        type: integer
        format: int64
      example: [1, 2, 3]

# コメント
MediaCommentResponseDto:
  type: object
  description: メディアコメント情報
  required:
    - id
    - mediaId
    - userId
    - displayName
    - userIconUrl
    - content
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int64
      description: コメントID
      example: 1
    userId:
      type: integer
      format: int64
      description: コメントしたユーザーID
      example: 1
    displayName:
      type: string
      description: コメントしたユーザーの表示名
      example: "パパ"
    userIconUrl:
      type: ["string", "null"]
      description: プロフィール画像URL
      example: "https://example.com/icon.png"
    content:
      type: string
      description: コメント本文
      example: "かわいい！"
    createdAt:
      type: string
      format: date-time
      description: 作成日時
      example: "2026-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 更新日時
      example: "2026-01-01T00:00:00Z"

MediaCommentRequestDto:
  type: object
  description: コメント作成・更新リクエスト
  required:
    - content
  properties:
    content:
      type: string
      description: コメント本文
      minLength: 1
      example: "かわいい！"
