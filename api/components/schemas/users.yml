# ユーザー情報取得スキーマ
UserResponseDto:
  type: object
  description: ユーザー情報
  required:
    - id
    - cognitoUserId
    - displayName
    - email
    - presignedIconUrl
    - scopeSharingGroups
    - isDarkMode
    - isEasyMode
    - role
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int64
      description: ユーザーID
      example: 1
    cognitoUserId:
      type: string
      description: Cognito ユーザーID
      example: "abc123-def456"
    displayName:
      type: string
      description: 表示名
      example: "ママ"
    email:
      type: string
      format: email
      description: メールアドレス
      example: "parent@example.com"
    presignedIconUrl:
      type: string
      format: uri
      description: S3用の署名付きURL
    scopeSharingGroups:
      type: array
      items:
        type: integer
        format: int64
        description: 共有グループID
        example: 1
    isDarkMode:
      type: boolean
      description: ダークモードフラグ
      example: false
    isEasyMode:
      type: boolean
      description: かんたんモードフラグ
      example: false
    role:
      type: string
      description: 権限ロール
      enum:
        - ADMIN
        - VIEWER
      example: "ADMIN"
    createdAt:
      type: string
      format: date-time
      description: 作成日時
      example: "2026-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 更新日時
      example: "2026-01-01T00:00:00Z"

# ユーザー情報更新スキーマ（自身の情報を更新）
UserUpdateRequestDto:
  type: object
  description: ユーザー情報更新リクエスト
  properties:
    displayName:
      type: string
      description: 表示名
      example: "ママ"
      minLength: 1
      maxLength: 100
    s3key:
      type: string
      description: S3のキー
    isDarkMode:
      type: boolean
      description: ダークモードフラグ
    isEasyMode:
      type: boolean
      description: かんたんモードフラグ

# ユーザー権限更新スキーマ（管理者限定で権限操作）
UserRoleUpdateRequestDto:
  type: object
  description: ユーザー権限更新リクエスト
  required:
    - role
  properties:
    role:
      type: string
      description: 権限ロール
      enum:
        - ADMIN
        - VIEWER
      example: "ADMIN"

# ユーザーアイコン画像更新時署名付きURL取得用スキーマ（自身の情報を更新）
UserUpdateIconRequestDto:
  type: object
  description: ユーザーアイコン画像更新時署名付きURL取得用リクエスト
  required:
    - filename
    - contentType
  properties:
    filename:
      type: string
      description: ファイル名
      maxLength: 255
      example: "profile.jpg"
    contentType:
      type: string
      description: MIMEタイプ
      example: "image/jpeg"

# ユーザーアイコン画像アップロード用URL
UserGenerateIconDataResponseDto:
  type: object
  description: ユーザー情報
  required:
    - presignedUrl
    - s3key
  properties:
    presignedUrl:
      type: string
      format: uri
    s3key:
      type: string
      description: S3のキー
