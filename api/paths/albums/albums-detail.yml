get:
  tags:
    - albumManagement
  summary: アルバムをID指定で取得
  operationId: getAlbum
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  responses:
    "200":
      description: アルバム情報
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../../components/schemas/albums.yml#/AlbumResponseDto"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

put:
  tags:
    - albumManagement
  summary: アルバムを更新
  operationId: updateAlbum
  x-codegen-request-body-name: AlbumData
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  requestBody:
    description: 更新するアルバム情報
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../../components/schemas/albums.yml#/AlbumRequestDto"
    required: true
  responses:
    "204":
      description: アルバムの更新に成功
    "400":
      $ref: "../../components/responses.yml#/BadRequest"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

delete:
  tags:
    - albumManagement
  summary: アルバムを削除
  operationId: deleteAlbum
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  responses:
    "204":
      description: アルバムの削除に成功
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"
