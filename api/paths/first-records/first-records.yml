get:
  tags:
    - firstRecordManagement
  summary: はじめて記録一覧を取得
  operationId: getFirstRecords
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
  responses:
    "200":
      description: はじめて記録一覧
      content:
        application/json;charset=UTF-8:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/first-records.yml#/FirstRecordResponseDto"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

post:
  tags:
    - firstRecordManagement
  summary: はじめて記録を登録
  operationId: createFirstRecord
  x-codegen-request-body-name: FirstRecordData
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
  requestBody:
    description: 登録するはじめて記録情報
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../../components/schemas/first-records.yml#/FirstRecordRequestDto"
    required: true
  responses:
    "201":
      description: 作成されたはじめて記録
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../../components/schemas/first-records.yml#/FirstRecordResponseDto"
    "400":
      $ref: "../../components/responses.yml#/BadRequest"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"
