get:
  tags:
    - growthRecordManagement
  summary: 身長・体重記録をID指定で1件取得
  operationId: getGrowthRecord
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  responses:
    "200":
      description: 身長・体重記録情報
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../../components/schemas/growth-records.yml#/GrowthRecordResponseDto"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

put:
  tags:
    - growthRecordManagement
  summary: 身長・体重記録を更新
  operationId: updateGrowthRecord
  x-codegen-request-body-name: GrowthRecordData
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  requestBody:
    description: 更新する身長・体重記録情報
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../../components/schemas/growth-records.yml#/GrowthRecordRequestDto"
    required: true
  responses:
    "204":
      description: 身長・体重記録の更新に成功
    "400":
      $ref: "../../components/responses.yml#/BadRequest"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

delete:
  tags:
    - growthRecordManagement
  summary: 身長・体重記録を削除
  operationId: deleteGrowthRecord
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  responses:
    "204":
      description: 身長・体重記録の削除に成功
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"
