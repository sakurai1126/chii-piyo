get:
  tags:
    - growthRecordManagement
  summary: 身長・体重記録一覧を取得
  operationId: getGrowthRecords
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/RequiredStartDate"
    - $ref: "../../components/parameters.yml#/RequiredEndDate"
  responses:
    "200":
      description: 身長・体重記録一覧
      content:
        application/json;charset=UTF-8:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/growth-records.yml#/GrowthRecordResponseDto"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

post:
  tags:
    - growthRecordManagement
  summary: 身長・体重記録を登録
  operationId: createGrowthRecord
  x-codegen-request-body-name: GrowthRecordData
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
  requestBody:
    description: 登録する身長・体重記録情報
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../../components/schemas/growth-records.yml#/GrowthRecordRequestDto"
    required: true
  responses:
    "201":
      description: 身長・体重記録の登録に成功
    "400":
      $ref: "../../components/responses.yml#/BadRequest"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"
