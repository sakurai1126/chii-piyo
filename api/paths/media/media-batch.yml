    - mediaManagement
  summary: メディアの一括更新
  operationId: updateMediaBatch
  x-codegen-request-body-name: MediaBatchUpdateData
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
  requestBody:
