  responses:
    "200":
      description: 共有グループ一覧
      content:
        application/json;charset=UTF-8:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/sharing-groups.yml#/SharingGroupResponseDto"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"
