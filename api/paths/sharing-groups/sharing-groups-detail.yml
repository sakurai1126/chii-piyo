get:
  tags:
    - sharingGroupManagement
  summary: 共有グループをID指定で取得
  operationId: getSharingGroup
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  responses:
    "200":
      description: 共有グループ情報
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../../components/schemas/sharing-groups.yml#/SharingGroupResponseDto"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

put:
  tags:
    - sharingGroupManagement
  summary: 共有グループを更新
  operationId: updateSharingGroup
  x-codegen-request-body-name: SharingGroupData
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  requestBody:
    description: 更新する共有グループ情報
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../../components/schemas/sharing-groups.yml#/SharingGroupRequestDto"
    required: true
  responses:
    "200":
      description: 更新された共有グループ
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../../components/schemas/sharing-groups.yml#/SharingGroupResponseDto"
    "400":
      $ref: "../../components/responses.yml#/BadRequest"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

delete:
  tags:
    - sharingGroupManagement
  summary: 共有グループを削除
  operationId: deleteSharingGroup
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/ResourceId"
  responses:
    "204":
      description: 共有グループの削除に成功
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"
