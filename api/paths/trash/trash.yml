get:
  tags:
    - trashManagement
  summary: ゴミ箱内のアイテム一覧を取得
  operationId: getTrashItems
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
    - $ref: "../../components/parameters.yml#/PageOffset"
    - $ref: "../../components/parameters.yml#/PageLimit"
  responses:
    "200":
      description: ゴミ箱アイテム一覧
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../../components/schemas/trash.yml#/TrashItemListResponseDto"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"

delete:
  tags:
    - trashManagement
  summary: ゴミ箱の中身をすべて空にする
  operationId: emptyTrash
  parameters:
    - $ref: "../../components/parameters.yml#/XRequestedWith"
  responses:
    "204":
      description: すべてのアイテムの完全削除に成功
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yml#/Forbidden"
    "500":
      $ref: "../../components/responses.yml#/InternalServerError"
    default:
      $ref: "../../components/responses.yml#/DefaultErrors"
