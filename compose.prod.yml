services:
  # -----------------------------
  # Reverse Proxy: Caddy
  # -----------------------------
  caddy:
    image: caddy:2-alpine
    container_name: chii-piyo-caddy
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfileを用いてリバースプロキシを設定
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 証明書や設定を永続化
      - caddy_data:/data
      - caddy_config:/config
    # バックエンドが起動した後にリバースプロキシを起動する
    depends_on:
      - backend

  # -----------------------------
  # Backend: Spring Boot
  # -----------------------------
  backend:
    # 本番環境用イメージをGitHub Container Registryから取得
    image: ghcr.io/sakurai1126/chii-piyo-backend:latest
    # コンテナ名を定義
    container_name: chii-piyo-backend
    # コンテナがクラッシュした場合、自動的に再起動する
    restart: always
    env_file:
      - .env
    environment:
      # JVMヒープ上限を制限し、OS・PostgreSQL・ffmpegとのメモリ競合を防ぐ
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m
      # タイムゾーンを日本時間に設定
      - TZ=Asia/Tokyo
    # PostgreSQLが起動した後にバックエンドを起動する
    depends_on:
      # postgres コンテナのヘルスチェックが成功するまでバックエンドの起動を遅延させる
      postgres:
        condition: service_healthy

  # -----------------------------
  # Database: PostgreSQL
  # -----------------------------
  postgres:
    image: postgres:18-alpine
    container_name: chii-piyo-db
    # コンテナがクラッシュした場合、自動的に再起動する
    restart: always
    env_file:
      - .env
    environment:
      # タイムゾーンを日本時間に設定
      - TZ=Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # 10秒おきにデータベースの起動確認コマンドを実行し、応答があるかをテストする
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Dockerホスト上の管理領域にデータを作成し、コンテナを削除してもデータの状態が維持されるようにするために必要
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
