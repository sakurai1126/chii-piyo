        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 復元されたメディア情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MediaResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognitoで取得したJWTトークンを指定
  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        default: XMLHttpRequest
    ResourceId:
      name: id
      in: path
      description: リソースの一意な識別子
      required: true
      schema:
        type: integer
        format: int64
    PageOffset:
      name: offset
      in: query
      description: 取得開始位置
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    PageLimit:
      name: limit
      in: query
      description: 取得件数
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    MediaTypeFilter:
      name: mediaKind
      in: query
      description: メディア種別で絞り込み
      required: false
      schema:
        type: string
        enum:
          - PHOTO
          - VIDEO
    AlbumIdFilter:
      name: albumId
      in: query
      description: アルバムIDで絞り込み
      required: false
      schema:
        type: integer
        format: int64
    TagIdFilter:
      name: tagId
      in: query
      description: タグIDで絞り込み（複数指定可、OR検索）
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
    SharingGroupIdFilter:
      name: sharingGroupId
      in: query
      description: 共有範囲グループIDで絞り込み
      required: false
      schema:
        type: integer
        format: int64
    StartDate:
      name: startDate
      in: query
      description: 検索開始日
      required: false
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      description: 検索終了日
      required: false
      schema:
        type: string
        format: date
    MediaId:
      name: mediaId
      in: path
      description: メディアの一意な識別子
      required: true
      schema:
        type: integer
        format: int64
    RecordTypeFilter:
      name: recordType
      in: query
      description: 育児記録種別で絞り込み
      required: false
      schema:
        type: string
        enum:
          - MEAL
          - MILK
          - DIAPER
          - HEALTH
  schemas:
    ErrorResponseDto:
      type: object
      description: エラーレスポンス
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: エラーコード
          example: BAD_REQUEST
        message:
          type: string
          description: エラーメッセージ
          example: リクエストが不正です
    UserResponseDto:
      type: object
      description: ユーザー情報
      required:
        - id
        - cognitoUserId
        - displayName
        - email
        - presignedIconUrl
        - scopeSharingGroups
        - isDarkMode
        - isEasyMode
        - role
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーID
          example: 1
        cognitoUserId:
          type: string
          description: Cognito ユーザーID
          example: abc123-def456
        displayName:
          type: string
          description: 表示名
          example: ママ
        email:
          type: string
          format: email
          description: メールアドレス
          example: parent@example.com
        presignedIconUrl:
          type: string
          format: uri
          description: S3用の署名付きURL
        scopeSharingGroups:
          type: array
          items:
            type: integer
            format: int64
            description: 共有グループID
            example: 1
        isDarkMode:
          type: boolean
          description: ダークモードフラグ
          example: false
        isEasyMode:
          type: boolean
          description: 簡易閲覧モードフラグ
          example: false
        role:
          type: string
          description: 権限ロール
          enum:
            - ADMIN
            - VIEWER
          example: ADMIN
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: '2026-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: '2026-01-01T00:00:00Z'
    UserUpdateRequestDto:
      type: object
      description: ユーザー情報更新リクエスト
      properties:
        displayName:
          type: string
          description: 表示名
          example: ママ
          minLength: 1
          maxLength: 100
        s3key:
          type: string
          description: S3のキー
        isDarkMode:
          type: boolean
          description: ダークモードフラグ
        isEasyMode:
          type: boolean
          description: 簡易閲覧モードフラグ
    UserUpdateIconRequestDto:
      type: object
      description: ユーザーアイコン画像更新時署名付きURL取得用リクエスト
      required:
        - filename
        - contentType
      properties:
        filename:
          type: string
          description: ファイル名
          maxLength: 255
          example: profile.jpg
        contentType:
          type: string
          description: MIMEタイプ
          example: image/jpeg
    UserGenerateIconDataResponseDto:
      type: object
      description: ユーザー情報
      required:
        - presignedUrl
        - s3key
      properties:
        presignedUrl:
          type: string
          format: uri
        s3key:
          type: string
          description: S3のキー
    UserRoleUpdateRequestDto:
      type: object
      description: ユーザー権限更新リクエスト
      properties:
        role:
          type: string
          description: 権限ロール
          enum:
            - ADMIN
            - VIEWER
          example: ADMIN
    SharingGroupMemberResponseDto:
      type: object
      description: 共有グループメンバー情報
      required:
        - id
        - userId
        - displayName
        - presignedIconUrl
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: メンバーID
          example: 1
        userId:
          type: integer
          format: int64
          description: ユーザーID
          example: 2
        displayName:
          type: string
          description: ユーザー表示名
          example: ママ
        presignedIconUrl:
          type:
            - string
            - 'null'
          description: プロフィール画像のS3署名付きURL
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: '2026-01-01T00:00:00Z'
    SharingGroupResponseDto:
      type: object
      description: 共有グループ情報
      required:
        - id
        - name
        - members
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: グループID
          example: 1
        name:
          type: string
          description: グループ名
          example: 家族全員
        members:
          type: array
          description: グループメンバー一覧
          items:
            $ref: '#/components/schemas/SharingGroupMemberResponseDto'
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: '2026-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: '2026-01-01T00:00:00Z'
    SharingGroupRequestDto:
      type: object
      description: 共有グループ作成リクエスト
      required:
        - name
      properties:
        name:
          type: string
          description: グループ名
          minLength: 1
          maxLength: 100
          example: 家族全員
        userIds:
          type: array
          description: グループメンバーID一覧
          items:
            type: integer
            format: int64
    SharingGroupUpdateRequestDto:
      type: object
      description: 共有グループ更新リクエスト
      properties:
        name:
          type: string
          description: グループ名
          minLength: 1
          maxLength: 100
          example: 家族全員
        userIds:
          type: array
          description: 新しい共有グループメンバーID一覧
          items:
            type: integer
            format: int64
    TagResponseDto:
      type: object
      description: タグ情報
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: タグID
          example: 1
        name:
          type: string
          description: タグ名
          example: お出かけ
        mediaCount:
          type: integer
          format: int64
          description: タグが紐づいているメディアの数
          example: 10
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: '2026-01-01T00:00:00Z'
    MediaNavigationResponseDto:
      type: object
      description: 前後のメディア情報
      required:
        - id
        - mediaType
      properties:
        id:
          type: integer
          format: int64
          description: メディアID
          example: 1
        thumbnailPresignedUrl:
          type:
            - string
            - 'null'
          format: uri
          description: サムネイルのS3アップロード用の署名付きURL
        mediaType:
          type: string
          description: メディア種別
          enum:
            - PHOTO
            - VIDEO
          example: PHOTO
    MediaResponseDto:
      type: object
      description: メディア情報
      required:
        - id
        - uploadedBy
        - mediaType
        - originalFilename
        - contentType
        - fileSize
        - width
        - height
        - takenAt
        - albumId
        - sharingGroupId
        - uploadStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: メディアID
          example: 1
        uploadedBy:
          type: integer
          format: int64
          description: アップロードしたユーザーID
          example: 1
        mediaType:
          type: string
          description: メディア種別
          enum:
            - PHOTO
            - VIDEO
          example: PHOTO
        originalFilename:
          type: string
          description: ファイル名
          example: IMG_20260101.jpg
        contentType:
          type: string
          description: MIMEタイプ
          example: image/jpeg
        fileSize:
          type: integer
          format: int64
          description: ファイルサイズ（バイト）
          example: 2048000
        width:
          type:
            - integer
            - 'null'
          description: 幅（ピクセル）
          example: 1920
        height:
          type:
            - integer
            - 'null'
          description: 高さ（ピクセル）
          example: 1080
        presignedUrl:
          type: string
          format: uri
          description: S3署名付きURL
        thumbnailPresignedUrl:
          type:
            - string
            - 'null'
          format: uri
          description: サムネイルのS3署名付きURL
        takenAt:
          type:
            - string
            - 'null'
          format: date
          description: 撮影日
          example: '2026-01-01'
        albumId:
          type:
            - integer
            - 'null'
          format: int64
          description: 所属アルバムID
          example: 1
        sharingGroupId:
          type: integer
          format: int64
          description: 共有範囲グループID
          example: 1
        uploadStatus:
          type: string
          description: アップロード状況
          enum:
            - PROCESSING
            - COMPLETED
            - FAILED
          example: COMPLETED
        tags:
          type: array
          description: 付与されているタグ一覧
          items:
            $ref: '#/components/schemas/TagResponseDto'
        isFavorite:
          type: boolean
          description: お気に入り済みフラグ
          example: false
        commentCount:
          type: integer
          format: int64
          description: コメント数
          example: 1
        nextMedia:
          type:
            - object
            - 'null'
          description: 1つ後のメディア
          $ref: '#/components/schemas/MediaNavigationResponseDto'
        secondNextMedia:
          type:
            - object
            - 'null'
          description: 2つ後のメディア
          $ref: '#/components/schemas/MediaNavigationResponseDto'
        previousMedia:
          type:
            - object
            - 'null'
          description: 1つ前のメディア
          $ref: '#/components/schemas/MediaNavigationResponseDto'
        secondPreviousMedia:
          type:
            - object
            - 'null'
          description: 2つ前のメディア
          $ref: '#/components/schemas/MediaNavigationResponseDto'
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: '2026-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: '2026-01-01T00:00:00Z'
    MediaListResponseDto:
      type: object
      description: メディア一覧レスポンス
      required:
        - items
        - totalCount
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaResponseDto'
        totalCount:
          type: integer
          format: int64
          description: 総件数
          example: 150
        hasNext:
          type: boolean
          description: 次のページが存在するかどうか
          example: true
    MediaUploadRequestDto:
      type: object
      description: メディアアップロードリクエスト
      required:
        - mediaType
        - originalFilename
        - contentType
        - fileSize
      properties:
        mediaType:
          type: string
          description: メディア種別
          enum:
            - PHOTO
            - VIDEO
          example: PHOTO
        originalFilename:
          type: string
          description: ファイル名
          maxLength: 255
          example: IMG_20260101.jpg
        contentType:
          type: string
          description: MIMEタイプ
          maxLength: 100
          example: image/jpeg
        fileSize:
          type: integer
          format: int64
          description: ファイルサイズ（バイト）
          example: 2048000
        width:
          type:
            - integer
            - 'null'
          description: 幅（ピクセル）
        height:
          type:
            - integer
            - 'null'
          description: 高さ（ピクセル）
        takenAt:
          type:
            - string
            - 'null'
          format: date
          description: 撮影日
          example: '2026-01-01'
        albumId:
          type:
            - integer
            - 'null'
          format: int64
          description: 所属アルバムID
        sharingGroupId:
          type:
            - integer
            - 'null'
          format: int64
          description: 共有範囲グループID
          example: 1
    MediaUploadResponseDto:
      type: object
      description: メディアアップロードレスポンス
      required:
        - mediaId
        - presignedUrl
      properties:
        mediaId:
          type: integer
          format: int64
          description: 作成されたメディアID
          example: 1
        presignedUrl:
          type: string
          format: uri
          description: S3アップロード用の署名付きURL
          example: https://s3.amazonaws.com/bucket/...
    MediaUpdateRequestDto:
      type: object
      description: メディア更新リクエスト
      properties:
        albumId:
          type:
            - integer
            - 'null'
          format: int64
          description: 所属アルバムID
        sharingGroupId:
          type:
            - integer
            - 'null'
          format: int64
          description: 共有範囲グループID
    MediaUploadStatusRequestDto:
      type: object
      description: メディアアップロードステータス更新リクエスト
      required:
        - uploadStatus
      properties:
        uploadStatus:
          type: string
          description: アップロード状況
          enum:
            - PROCESSING
            - COMPLETED
            - FAILED
          example: COMPLETED
    MediaCommentResponseDto:
      type: object
      description: メディアコメント情報
      required:
        - id
        - userId
        - displayName
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: コメントID
          example: 1
        userId:
          type: integer
          format: int64
          description: コメントしたユーザーID
          example: 1
        displayName:
          type: string
          description: コメントしたユーザーの表示名
          example: パパ
        presignedIconUrl:
          type: string
          format: uri
          description: プロフィール画像のS3署名付きURL
        content:
          type: string
          description: コメント本文
          example: かわいい！
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: '2026-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: '2026-01-01T00:00:00Z'
    MediaCommentRequestDto:
      type: object
      description: コメント作成・更新リクエスト
      required:
        - content
      properties:
        content:
          type: string
          description: コメント本文
          minLength: 1
          example: かわいい！
    MediaTagsUpdateRequestDto:
      type: object
      description: メディアのタグ一括更新リクエスト
      required:
        - tagIds
      properties:
        tagIds:
          type: array
          description: 紐付けるタグIDの一覧
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
            - 3
    TagRequestDto:
      type: object
      description: タグ作成リクエスト
      required:
        - name
      properties:
        name:
          type: string
          description: タグ名
          minLength: 1
          maxLength: 100
          example: お出かけ
    FavoriteMediaListResponseDto:
      type: object
      description: お気に入りメディア一覧レスポンス
      required:
        - items
        - totalCount
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaResponseDto'
        totalCount:
          type: integer
          format: int64
          description: 総件数
          example: 10
        hasNext:
          type: boolean
          description: 次のページが存在するかどうか
          example: true
    AlbumResponseDto:
      type: object
      description: アルバム情報
      required:
        - id
        - title
        - coverMediaUrls
        - photoCount
        - videoCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: アルバムID
          example: 1
        title:
          type: string
          description: アルバムタイトル
          example: 2026年お正月
        coverMediaUrls:
          type: array
          description: カバー画像のURLリスト（アルバム内の最新の写真のURLを最大3件返す）
          items:
            type:
              - string
              - 'null'
            description: カバー画像のURL
            example: https://example.com/cover.jpg
        photoCount:
          type: integer
          description: アルバム内写真数
          example: 15
        videoCount:
          type: integer
          description: アルバム内動画数
          example: 15
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: '2026-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: '2026-01-01T00:00:00Z'
    AlbumRequestDto:
      type: object
      description: アルバム作成・更新リクエスト
      required:
        - title
      properties:
        title:
          type: string
          description: アルバムタイトル
          minLength: 1
          maxLength: 200
          example: 保育園の運動会
    AlbumMediaAddRequestDto:
      type: object
      description: アルバムへのメディア追加リクエスト
      required:
        - mediaIds
      properties:
        mediaIds:
          type: array
          description: 追加するメディアIDの一覧
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
            - 3
    MealDetailDto:
      type: object
      description: 食事記録の詳細
      required:
        - note
      properties:
        note:
          type:
            - string
            - 'null'
          description: 食事内容・メモ
          example: おかゆと野菜ペースト
    MilkDetailDto:
      type: object
      description: ミルク記録の詳細
      required:
        - amountMl
        - note
      properties:
        amountMl:
          type:
            - integer
            - 'null'
          description: 量（ml）
          example: 200
        note:
          type:
            - string
            - 'null'
          description: メモ・備考
          example: よく飲んだ
    DiaperDetailDto:
      type: object
      description: 排泄記録の詳細
      required:
        - diaperType
        - note
      properties:
        diaperType:
          type: string
          description: 排泄種別
          enum:
            - WET
            - DIRTY
          example: WET
        note:
          type:
            - string
            - 'null'
          description: メモ・備考
    HealthDetailDto:
      type: object
      description: 体調記録の詳細
      required:
        - temperature
        - note
      properties:
        temperature:
          type:
            - number
            - 'null'
          format: double
          description: 体温
          example: 36.5
        note:
          type:
            - string
            - 'null'
          description: メモ・備考
          example: 元気
    CareRecordResponseDto:
      type: object
      description: 育児記録情報
      required:
        - id
        - recordedBy
        - recordType
        - recordedAt
        - mealDetail
        - milkDetail
        - diaperDetail
        - healthDetail
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: 育児記録ID
          example: 1
        recordedBy:
          type: integer
          format: int64
          description: 記録者のユーザーID
          example: 1
        recordType:
          type: string
          description: 記録種別
          enum:
            - MEAL
            - MILK
            - DIAPER
            - HEALTH
          example: MILK
        recordedAt:
          type: string
          format: date-time
          description: 記録日時
          example: '2026-01-01T08:00:00Z'
        mealDetail:
          anyOf:
            - $ref: '#/components/schemas/MealDetailDto'
            - type: 'null'
        milkDetail:
          anyOf:
            - $ref: '#/components/schemas/MilkDetailDto'
            - type: 'null'
        diaperDetail:
          anyOf:
