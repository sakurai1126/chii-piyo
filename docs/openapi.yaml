openapi: 3.1.1
info:
  title: ちいぴよ API
  description: 子供の写真・動画管理及び育児記録管理アプリケーションのAPI定義
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
security:
  - BearerAuth: []
tags:
  - name: userManagement
    description: ユーザー情報管理
  - name: sharingGroupManagement
    description: 共有範囲グループ管理
  - name: mediaManagement
    description: 写真・動画管理
  - name: mediaCommentManagement
    description: 写真・動画へのコメント管理
  - name: tagManagement
    description: タグ管理
  - name: favoriteManagement
    description: お気に入り管理
  - name: albumManagement
    description: アルバム管理
  - name: careRecordManagement
    description: 育児記録管理
  - name: growthRecordManagement
    description: 身長・体重記録管理
  - name: firstRecordManagement
    description: はじめて記録管理
  - name: wordRecordManagement
    description: ことばの記録管理
  - name: trashManagement
    description: ゴミ箱管理
paths:
  /users:
    get:
      tags:
        - userManagement
      summary: ログインユーザー一覧の情報を取得
      operationId: getUsers
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: ユーザー情報一覧
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /users/me:
    get:
      tags:
        - userManagement
      summary: ログインユーザーの情報を取得
      operationId: getMe
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    put:
      tags:
        - userManagement
      summary: ログインユーザーの情報を更新
      operationId: updateMe
      x-codegen-request-body-name: UserUpdateData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        description: 更新するユーザー情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/UserUpdateRequestDto'
        required: true
      responses:
        '200':
          description: 更新後のユーザー情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /users/me/icon:
    post:
      tags:
        - userManagement
      summary: ログインユーザーのアイコン用情報を送信し、S3署名付きURLを取得
      operationId: generateIconPresignedUrl
      x-codegen-request-body-name: UserGenerateIconData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        description: 生成するユーザーのアイコン画像のファイル名情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/UserUpdateIconRequestDto'
        required: true
      responses:
        '200':
          description: 生成後のユーザーの情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UserGenerateIconDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /users/{id}/role:
    put:
      tags:
        - userManagement
      summary: ログインユーザーの権限を更新
      operationId: updateRole
      x-codegen-request-body-name: UserUpdateRoleData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        description: 更新するユーザー情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequestDto'
        required: true
      responses:
        '200':
          description: 更新後のユーザー情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /sharing-groups:
    get:
      tags:
        - sharingGroupManagement
      summary: 共有グループ一覧を取得
      operationId: getSharingGroups
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: 共有グループ一覧
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharingGroupResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    post:
      tags:
        - sharingGroupManagement
      summary: 共有グループを新規作成
      operationId: createSharingGroup
      x-codegen-request-body-name: SharingGroupData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        description: 作成する共有グループ情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/SharingGroupRequestDto'
        required: true
      responses:
        '201':
          description: 共有グループ作成成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /sharing-groups/{id}:
    get:
      tags:
        - sharingGroupManagement
      summary: 共有グループをID指定で取得
      operationId: getSharingGroup
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 共有グループ情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SharingGroupResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    put:
      tags:
        - sharingGroupManagement
      summary: 共有グループを編集
      operationId: updateSharingGroup
      x-codegen-request-body-name: SharingGroupUpdateData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        description: 編集する共有グループ情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/SharingGroupUpdateRequestDto'
        required: true
      responses:
        '200':
          description: 更新された共有グループ情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SharingGroupResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    delete:
      tags:
        - sharingGroupManagement
      summary: 共有グループを削除
      operationId: deleteSharingGroup
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: 共有グループの削除に成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /media:
    get:
      tags:
        - mediaManagement
      summary: メディア一覧を取得
      operationId: getMediaList
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/MediaTypeFilter'
        - $ref: '#/components/parameters/AlbumIdFilter'
        - $ref: '#/components/parameters/TagIdFilter'
        - $ref: '#/components/parameters/SharingGroupIdFilter'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: メディア一覧
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MediaListResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    post:
      tags:
        - mediaManagement
      summary: メディアのメタデータを登録し署名付きアップロードURLを取得
      operationId: createMedia
      x-codegen-request-body-name: MediaUploadData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        description: アップロードするメディアのメタデータ
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MediaUploadRequestDto'
        required: true
      responses:
        '201':
          description: メタデータ登録成功、署名付きURLを返却
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MediaUploadResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /media/{id}:
    get:
      tags:
        - mediaManagement
      summary: メディアをID指定で1件取得
      operationId: getMedia
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: メディア情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MediaResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    put:
      tags:
        - mediaManagement
      summary: メディア情報を更新
      operationId: updateMedia
      x-codegen-request-body-name: MediaUpdateData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        description: 更新するメディア情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MediaUpdateRequestDto'
        required: true
      responses:
        '204':
          description: メディアの更新に成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    delete:
      tags:
        - mediaManagement
      summary: メディアを削除
      description: ゴミ箱に移動し30日間保持
      operationId: deleteMedia
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: メディアの削除に成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /media/{id}/status:
    put:
      tags:
        - mediaManagement
      summary: メディアのアップロード状態を更新
      operationId: updateMediaUploadStatus
      x-codegen-request-body-name: MediaUpdateStatusData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        description: 更新するステータス情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MediaUploadStatusRequestDto'
        required: true
      responses:
        '200':
          description: 更新されたメディア情報
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MediaResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /media/{mediaId}/comments:
    get:
      tags:
        - mediaCommentManagement
      summary: メディアのコメント一覧を取得
      operationId: getMediaComments
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: コメント一覧
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaCommentResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    post:
      tags:
        - mediaCommentManagement
      summary: メディアにコメントを追加
      operationId: createMediaComment
      x-codegen-request-body-name: MediaCommentData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        description: コメント内容
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MediaCommentRequestDto'
        required: true
      responses:
        '201':
          description: コメントの追加に成功
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MediaCommentResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /media/{mediaId}/comments/{id}:
    put:
      tags:
        - mediaCommentManagement
      summary: コメントを更新
      operationId: updateMediaComment
      x-codegen-request-body-name: MediaCommentData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        description: 更新するコメント内容
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MediaCommentRequestDto'
        required: true
      responses:
        '200':
          description: 更新されたコメント
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/MediaCommentResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    delete:
      tags:
        - mediaCommentManagement
      summary: コメントを削除
      operationId: deleteMediaComment
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: コメントの削除に成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /media/{mediaId}/tags:
    put:
      tags:
        - tagManagement
      summary: メディアのタグを一括更新
      operationId: updateMediaTags
      x-codegen-request-body-name: MediaTagsData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        description: 紐付けるタグIDの一覧
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MediaTagsUpdateRequestDto'
        required: true
      responses:
        '200':
          description: 更新後のタグ一覧
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /tags:
    get:
      tags:
        - tagManagement
      summary: タグ一覧を取得
      operationId: getTags
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: タグ一覧
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    post:
      tags:
        - tagManagement
      summary: タグを作成
      operationId: createTag
      x-codegen-request-body-name: TagData
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        description: 作成するタグ情報
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/TagRequestDto'
        required: true
      responses:
        '201':
          description: 作成されたタグ
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/TagResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /favorites:
    get:
      tags:
        - favoriteManagement
      summary: お気に入りメディア一覧を取得
      operationId: getFavorites
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: お気に入りメディア一覧
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/FavoriteMediaListResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /favorites/{mediaId}:
    post:
      tags:
        - favoriteManagement
      summary: メディアをお気に入りに追加
      operationId: addFavorite
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/MediaId'
      responses:
        '201':
          description: お気に入りの追加に成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
    delete:
      tags:
        - favoriteManagement
      summary: メディアをお気に入りから削除
      operationId: removeFavorite
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/MediaId'
      responses:
        '204':
          description: お気に入りの削除に成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultErrors'
  /albums:
    get:
      tags:
        - albumManagement
      summary: アルバム一覧を取得
      operationId: getAlbums
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
